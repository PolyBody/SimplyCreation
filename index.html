<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simply Creation</title>
<meta name="description" content="Simply Creation — студия игр для ПК и Android.">
<link rel="icon" href="logo.png">
<style>
:root{--bg:#000;--fg:#fff;--dim:#8a8a8a;--line:#262626;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100svh;background:var(--bg);color:var(--fg);font:16px/1.65 "Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:grid;place-items:center;padding:48px 6vw;overflow-x:hidden}
.bio{width:min(640px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;gap:28px}
.logo{width:min(200px,56vw);height:auto;filter:drop-shadow(0 0 26px rgba(255,255,255,.16));animation:logoIn 1.1s var(--ease) both,float 6s ease-in-out 1.1s infinite}
h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;letter-spacing:-.02em;line-height:1.1;animation:fadeUp .9s var(--ease) .45s both}
.kicker{font-size:.78rem;letter-spacing:.38em;text-transform:uppercase;color:var(--dim);animation:fadeUp .9s var(--ease) .3s both}
.rule{width:56px;height:1px;background:var(--line);animation:grow .9s var(--ease) .6s both}
.text{color:#cfcfcf;animation:fadeUp .9s var(--ease) .7s both}
.text + .text{margin-top:-8px}
.facts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;animation:fadeUp .9s var(--ease) .9s both}
.fact{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.88rem;color:var(--dim)}
@keyframes logoIn{from{opacity:0;transform:scale(.7) rotate(-6deg);filter:blur(10px)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<main class="bio">
  <img class="logo" src="logo.png" alt="Логотип Simply Creation">
  <p class="kicker">Игровая студия</p>
  <h1>Simply Creation</h1>
  <div class="rule" aria-hidden="true"></div>
  <p class="text">Мы делаем небольшие, но цепляющие игры для ПК и Android. Простое управление, понятный мир и внимание к каждой детали.</p>
  <p class="text">Студия небольшая, поэтому каждое решение принимаем сами и быстро. Ваши отзывы влияют на то, что мы делаем дальше.</p>
  <div class="facts">
    <span class="fact">ПК · Android</span>
    <span class="fact">Игры без лишнего</span>
  </div>
</main>
</body>
</html>
